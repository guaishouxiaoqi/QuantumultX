name: 常用规则合集
desc: |
  Copilot 代理 + 广告拦截
  版本: v1.0.2
  更新日期: 2025-12-21
  说明: 包含 Copilot, apple intelligence访问chatgpt等 强制走代理规则和常见广告拦截规则

rule-sets:
  - name: AI-Force-Proxy
    type: local
    rules:
      # ======= Copilot 强制走代理 =======
      - DOMAIN-SUFFIX,copilot.microsoft.com
      - DOMAIN-SUFFIX,edgeservices.bing.com
      - DOMAIN-SUFFIX,bing.com
      # ======= apple intelligence 访问chatgpt 强制走代理 =======
      - DOMAIN-SUFFIX,*.smoot.apple.com
      # - DOMAIN-SUFFIX,apple.com
      - DOMAIN-SUFFIX,gspe1-ssl.ls.apple.com
      - DOMAIN-SUFFIX,cp4.cloudflare.com
      - DOMAIN-SUFFIX,quzzoni.apple.com
      - DOMAIN-SUFFIX,apple-relay.cloudflare.com
      - DOMAIN-SUFFIX,apple-relay.fastly-edge.com
      - DOMAIN-SUFFIX,apple-relay.apple.com
      - DOMAIN-SUFFIX,smoot.apple.com
      - DOMAIN-SUFFIX,guzzoni.apple.com
      - DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net
      - DOMAIN-SUFFIX,gateway.icloud.com
      # - DOMAIN-SUFFIX,gateway.fe2.apple-dns.net
      # - DOMAIN-SUFFIX,seed.siri.apple.com
      # - DOMAIN-SUFFIX,v.aaplimg.com
      # - DOMAIN-SUFFIX,seed-siri-apple-com.v.aaplimg.com
      # - DOMAIN-SUFFIX,smoot-searchv2-aapse1c.v.aaplimg.com
      # - DOMAIN-SUFFIX,apps.mzstatic.com

rules:
  # - RULE-SET,AI-Force-Proxy,^.(?i)(节点|选择|手动|切换|dog|泡泡|良心|proxy|主|auto|select|manual).*$,type: select
  - RULE-SET,AI-Force-Proxy,^.(?i)(节点|选择|手动|切换|dog|狗|proxy|主|auto|select|manual|良心|优质|高速|主力).*$,type: select